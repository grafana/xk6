name: Release

on:
  # #region triggers
  push:
    tags: ["v*.*.*"]
  # #endregion triggers

permissions: {}

jobs:
  configure:
    name: Configure
    runs-on: ubuntu-latest
    outputs:
      go-current: ${{ steps.go-versions.outputs.current }}
    steps:
      - name: Resolve Go versions
        id: go-versions
        uses: grafana/k6-ci/.github/actions/go-versions@03469f9ae7aad25369827832c456e8f8b7b8c1c2 # v0.5.0

  release:
    name: Release
    needs: configure
    uses: ./.github/workflows/tooling-release.yml
    permissions:
      contents: write
      packages: write
      id-token: write
    with:
      # #region inputs
      go-version: ${{ needs.configure.outputs.go-current }}
      goreleaser-version: "2.17.1"
      k6-versions: '["v2.0.0"]'
      bats: ./.github/release.bats
      # #endregion inputs
  liveness:
    name: Liveness
    needs: ["release"]
    uses: ./.github/workflows/liveness.yml
    permissions:
      contents: read
    with:
      xk6-version: "${{github.ref_name}}"
      xk6-it-version: "submodule"
